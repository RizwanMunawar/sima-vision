# SiMa Neat instance segmentation with a background blur
#
# Every setting below is the built-in default written out, so deleting a line
# changes nothing. Paths are relative to the directory you launch from.
# Windows paths (C:\ D:\) cannot work: the app runs on Linux.

model:
  # Where the compiled archive is. This is the default, and if it is not there
  # yet the first run fetches it with `sima-cli` -- so you can delete the line.
  # An https URL works too, and is downloaded into assets/models/ once.
  path: assets/models/yolo26n-seg-bf16-mla_tess-b1.tar.gz

  # Class names, one per line. Unset uses the COCO list inside the package,
  # which is what these models were compiled against.
  # labels: my-classes.txt

  # Segment head. Must match your model or you get no masks.
  # yolov5-seg | yolov7-seg | yolov8-seg | yolov9-seg | yolov10-seg
  # | yolo11-seg | yolo26-seg
  # A plain detect head has no mask data at all. If that is what you have,
  # set segmentation.masks: off below and the blur uses bounding boxes.
  family: yolo26-seg

  decode_type_option: auto            # head packing override, leave auto for SiMa model packs
  num_classes: 0                      # 0 = read from the model archive

source:
  type: video                          # video | rtsp | usb

  # A file, or an https URL to one, or empty for the sample clip below --
  # which is on a public GitHub release and is fetched on the first run.
  # Downloads land in assets/videos/. .h264 only for files, see the note below.
  uri: assets/videos/people-walking-outside-mall.h264

  # Leave these at 0. For .h264 the app reads the real geometry out of the
  # stream's SPS, and the stream always wins over anything set here.
  fps: 0
  width: 0
  height: 0

  rtsp:
    codec: h264                        # h264 | mjpeg
    tcp: true
    latency_ms: 100

  usb:
    camera_name: ""                    # "" = DevKit default camera
    format: NV12

# Use a raw H.264 elementary stream, not .mp4. Containers hit a demuxer bug in
# Neat 0.3.0. Convert losslessly:
#   ffmpeg -i clip.mp4 -c:v copy -bsf:v h264_mp4toannexb -f h264 clip.h264

preprocess:
  # What the app asks for. The route planner resolves it against the model
  # archive and compiles the matching graph. `auto` means "planner decides".
  kind: image                # image | tensor | auto
  enable: on                 # on | off | auto

  input_format: NV12         # what the source produces: NV12 for video/rtsp/usb, BGR for images
  output_format: auto        # auto = take it from the model contract

  input_max_width: 0         # 0 = use the probed source size
  input_max_height: 0

  resize:
    enable: on
    width: 0                 # 0 = infer from the model (640x640 for most YOLO)
    height: 0
    mode: letterbox          # letterbox (YOLO default) | stretch | crop
    pad_value: 114
    scaling_type: BILINEAR   # BILINEAR | NEAREST_NEIGHBOUR | BICUBIC | INTERAREA | NO_SCALING

  normalize:
    enable: on
    preset: coco_yolo        # coco_yolo (all YOLO) | imagenet | none
    mean: [0.0, 0.0, 0.0]    # only read when preset is none
    stddev: [1.0, 1.0, 1.0]

  # Leave both auto. The model pack's dtype contract decides whether these run
  # in the preprocess graph or inside the MLA.
  quantize:
    enable: auto
    zero_point: 0
    scale: 0.0               # 0.0 = use the model's calibration
  tessellate:
    enable: auto
    slice_shape: []          # empty = use the contract geometry

decode:
  score_threshold: 0.30      # minimum confidence, 0.0 keeps the packaged value
  nms_iou: 0.60              # overlap threshold for non-max suppression
  max_detections: 50         # top-K cap per frame

# How per-instance masks are recovered from the model output.
#
# Boxes come back in source-image pixels, because Preproc records the letterbox
# on the tensor and BoxDecode undoes it. Masks do not get that treatment: they
# arrive in the network's own 640x640 space at a quarter resolution, and the app
# maps them back onto the frame itself.
#
# Three mask encodings exist, and `source: auto` works out which one arrived:
#   packed  what SiMa's neatobjectdecode actually emits: ONE uint8 tensor whose
#           head is the usual BBOX array and whose tail is one finished mask per
#           box slot. There are top_k slots, not `count`, so the buffer is the
#           same size every frame:
#             [uint32 count][RawBox 24B * top_k][mask side*side uint8 * top_k]
#           With max_detections: 50 and a 640-input model that is
#             4 + 50*24 + 50*160*160 = 1281204 bytes.
#   planes  the same finished masks, but in a tensor of their own, N x mh x mw.
#   proto   the Ultralytics encoding. C shared prototype planes plus C
#           coefficients per instance; the mask is their weighted sum.
#
# The first frame with detections prints every tensor the model emitted plus the
# packed layout it solved, so the arithmetic above is visible in your own log.
# Nothing here needs touching for a stock SiMa model pack.
segmentation:
  masks: on                  # off = blur around plain boxes, no segment head needed
  source: auto               # auto | packed | proto | planes
  threshold: 0.5             # mask cut-off as a probability. Lower grows instances
  describe: on               # print the model's output tensors on the first frame

  # Which space a mask lives in. `net` is the model's own letterboxed 640x640
  # input, the YOLO convention, and the app undoes the letterbox. `box` means
  # the mask is already cropped to its detection and only needs scaling.
  # `auto` checks whether the mask's ink lands where its box says it should,
  # decides on the first frame, and prints the verdict.
  space: auto                # auto | net | box

  stride: 4                  # model input pixels per mask pixel. 4 for YOLO-seg
  net_width: 0               # 0 = derive from preprocess.resize, then from the mask
  net_height: 0
  coeff_counts: [16, 32, 64] # prototype bank sizes to recognise while auto-detecting

  blur_mask: 0               # smooth the mask edge, px @1080p. Try 5 on a jagged mask
  dilate: 0                  # grow the mask, px @1080p. Try 2 to cover a hair halo

  # A run with no mask data still produces video: the blur falls back to
  # box-shaped regions and says so once. Turn this off to fail loudly instead.
  fallback_to_boxes: on

# -----------------------------------------------------------------------------
# OPTIONAL: blur everything outside the masks.
#
# This app is a segmenter. It finds instances and draws their masks whatever is
# set here. This block is one extra thing it can do with those masks: treat the
# area they do NOT cover.
#
#   enable: off    pure segmentation, the frame is left alone
#   opacity: 1.0   full-strength treatment
#   opacity: 0.35  a hint of it, the background still readable
#   opacity: 0.0   same result as enable: off
#
# Sizes are pixels for a 1080p frame and follow visualization.auto_scale, so a
# kernel tuned on a test clip still holds at 4K.
#
# With no detections in a frame there is no foreground, so the whole frame is
# background and the whole frame is treated. That is the definition working, not
# a bug.
# -----------------------------------------------------------------------------
blur:
  enable: on                 # off = segmentation only, no background treatment
  opacity: 1.0               # strength of the treatment, 0.0 to 1.0

  method: gaussian           # gaussian | pixelate | none

  kernel: 41                 # gaussian width, forced odd. Bigger is blurrier
  sigma: 0.0                 # 0 = derive from kernel
  downscale: 2               # blur at 1/N resolution. The main speed knob

  pixel_size: 24             # mosaic block size, used when method is pixelate

  dim: 0.0                   # darken the background, 0.0 to 1.0
  grayscale: off             # desaturate the background
  feather: 9                 # cross-fade the mask edge over N px. 0 = hard cut

  # Blur the instances instead of the background. keep_classes: [person] plus
  # invert: on is the anonymiser.
  invert: off

  # Which classes count as foreground and stay sharp. Names from the labels
  # file, or bare ids. Empty keeps every detected class.
  keep_classes: []

runtime:
  frames: 0                  # 0 = run until interrupted
  pull_timeout_ms: 20000     # how long to wait for a frame before giving up

  # Depth of the runtime's own queues, and of the app's sink thread.
  #
  # It does NOT set the buffer counts in the pipeline the app prints at startup:
  # `max-buffers=4` on the appsinks and `num-buffers=4` on preproc and the MLA
  # are fixed inside pyneat and read the same at 1 as at 3. So this is not the
  # knob for "the run stops after N frames and then times out"  - measured on a
  # Modalix DevKit with the yolo26m-seg pack, 3 stalled at 22 frames and 1 at
  # 17, which is the same stall with different noise.
  #
  # What it does change is how far ahead of the sinks this app may run. Low
  # keeps memory flat; higher absorbs an uneven frame.
  queue_depth: 1

  # Buffers each public output may hold. There are two public outputs, so this
  # number is doubled, and every one of them can hold a frame checked out of
  # the hardware decoder's pool of 8 (`BufferNum=8` in the boot log).
  #
  # Measured at queue_depth 3: 4 -> stalls at 8 frames, 2 -> at 25, 1 -> at 22.
  # More buffers clearly stalls sooner, but 1 still did not reach the end of the
  # clip, so this is a contributing term rather than the cause. The cause was
  # the decoded path in front of the appsink; see make_elementary_h264_source.
  # Raise it only if a run completes and you want more headroom.
  output_buffers: 1
  # auto splits on source type, because a file and a camera want opposites:
  #   file        -> reliable + block       every frame is kept, no deadline
  #   rtsp / usb  -> realtime + keep_latest stay current, a camera cannot pause
  # Forcing keep_latest on a file is what makes the recording short and fast:
  # inference is slower than decoding, the surplus frames are discarded, and the
  # survivors are still written at the source rate.
  preset: auto               # auto | realtime | balanced | reliable
  overflow_policy: auto      # auto | block | keep_latest | drop_incoming
  profile: false             # per-stage timings, including the mask stage
  profile_interval: 100

# How the overlay looks. Sizes are in pixels for a 1080p frame; with
# auto_scale on they are multiplied by (frame height / reference_height), so 4K
# does not get hairlines and 480p does not get slabs. Colours are [B, G, R]
# because OpenCV is BGR, so [0, 0, 255] is red.
visualization:
  mask_alpha: 0.35           # class-coloured tint over each instance. 0 = none
  mask_outline: on           # trace the mask edge
  outline_thickness: 3

  show_boxes: off            # the mask already shows the extent
  box_thickness: 2

  text_scale: 1.0            # caption font size multiplier
  text_thickness: 2          # caption stroke weight
  text_padding: 10           # gap between caption text and the edge of its band

  show_labels: on            # class name in the caption
  show_scores: on            # confidence in the caption
  score_decimals: 2          # 2 gives "person 0.57", 0 gives "person 1"

  text_color: [255, 255, 255]   # caption text, white

  auto_scale: on             # scale every size above with the frame height
  reference_height: 1080     # the height those sizes are tuned for

  # The FPS badge in the corner, drawn when output.video.hud is true.
  # text_scale, text_thickness and padding follow the caption settings above
  # when left at 0. Padding is what sets the badge size; the two minimums can
  # only make it bigger, and the text stays centred either way.
  hud:
    text_color: [104, 31, 17]
    bg_color: [255, 255, 255]
    text_scale: 2.0          # 0 = follow text_scale above
    text_thickness: 5        # 0 = follow text_thickness above

    # Breathing room inside the badge, between the text and the badge edge.
    # `padding` sets all four sides; padding_x / padding_y override the
    # horizontal and vertical pair independently. 0 on either follows `padding`.
    padding: 22              # 0 = follow text_padding above
    padding_x: 34            # left and right gap
    padding_y: 24            # top and bottom gap

    # Gap between the badge and the top-left corner of the frame.
    # 0 on either follows the matching padding.
    margin_x: 28
    margin_y: 24

    fps_decimals: 0          # 0 gives "FPS: 25", 1 gives "FPS: 24.8"
    min_width: 0             # 0 = fit the text
    min_height: 0            # 0 = fit the text

output:

  # Composited video written on the DevKit, one entry per processed frame.
  # Survives the run, unlike the UDP feed.
  video:
    enable: true
    path: segmentation.mp4
    codec: mp4v              # 4-char FourCC, falls back to MJPG/.avi automatically
    fps: 0                   # 0 = match the source
    hud: true                # small FPS badge in the top-left corner

  # Composited stills. `every` below skips STILLS only. The video above always
  # gets every processed frame; there is no frame-skip setting for it.
  save:
    enable: false
    dir: frames
    # Write every Nth frame, 0 disables. A 1080p JPEG per frame is real work on
    # the board; 10 gives you plenty to look at and keeps the pipeline ahead of
    # the decoder.
    every: 10
    overlay: false            # false writes the untouched frame instead
    format: jpg              # jpg | png

  # Optional live UDP feed to Neat Insight. Off by default: everything you need
  # is the composited video and stills above, which survive the run. Turning this
  # on also needs inbound UDP 9000-9079 / 9100-9179 opened on the Hyper-V firewall.
  #
  # Insight draws from metadata, which carries boxes but no masks, so leave
  # annotated: true if you want to see the blur in the live feed.
  insight:
    enable: false
    annotated: true           # send our composite. false sends the raw frame
    host: 192.168.137.1       # your PC ip address as the DevKit sees it, NOT 127.0.0.1
    channel: 0                # video port = video_port_base + channel
    video_port_base: 9000
    metadata_port_base: 9100
    bitrate_kbps: 2000
