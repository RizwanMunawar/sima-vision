[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "sima-vision"
# Read from sima_vision/__init__.py, which is the one place the version is
# written. Releasing is triggered by that line changing, so a second copy here
# could ship a wheel labelled with the version you did not bump.
dynamic = ["version"]
description = "Live YOLO computer vision on a SiMa Modalix DevKit 3.0: detection, segmentation and fall detection"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.10"
authors = [{ name = "Muhammad Rizwan Munawar" }]
keywords = [
    "sima", "modalix", "devkit", "yolo", "ultralytics", "neat", "palette-sdk",
    "computer-vision", "object-detection", "instance-segmentation", "edge-ai",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Console",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Image Recognition",
]

# One dependency, and it is pure Python. That is what lets `pip install
# sima-vision` be the whole install on a laptop and on the board alike.
#
# pyneat is deliberately absent: it is an aarch64 wheel that ships with the
# Palette SDK and is not on PyPI, so listing it would make the install fail
# everywhere, the DevKit included. Same for numpy and OpenCV, which the board
# provides in /usr/lib/python3*/dist-packages -- depending on opencv-python
# would pull numpy 2.x over the board's copy and break every simaai-* package,
# so installing this package would break the board. sima_vision/bootstrap.py
# finds all three at run time instead, and pins numpy below 2 on the one path
# where it does install anything.
dependencies = [
    "pyyaml>=6.0",
]

[project.optional-dependencies]
# Not normally needed: a run installs these itself, into whichever virtualenv
# holds pyneat, and only when the board turns out not to have them. Kept as an
# extra so the same pinning is available by hand on a board where automatic
# installs are turned off with SIMA_VISION_AUTO_INSTALL=0. numpy is capped
# because pyneat 0.3.0 requires numpy<2 and 2.x breaks every simaai-* package.
board = [
    "numpy>=1.24,<2",
    "opencv-python>=4.7,<5",
]
# One command gets you a working checkout: the test suite exercises the mask
# decoding, compositing and overlay for real, so it needs numpy and OpenCV
# even though the package itself does not. Headless, because no test opens
# a window and the GUI build drags in system libraries CI does not have.
dev = [
    "pytest>=7.4",
    "ruff>=0.5",
    "numpy>=1.24",
    "opencv-python-headless>=4.7",
]

[project.urls]
Homepage = "https://github.com/RizwanMunawar/sima-projects"
Repository = "https://github.com/RizwanMunawar/sima-projects"
Issues = "https://github.com/RizwanMunawar/sima-projects/issues"

[project.scripts]
# NOT `sima-cli`: that name belongs to SiMa.ai's own CLI, which installs the
# Neat core and pairs the board. Shadowing it would break the DevKit workflow.
sima-vision = "sima_vision.cli:main"

# Another distribution adds a subcommand by advertising one of these; see
# sima_vision/tasks/__init__.py. The built-in three are registered in code
# rather than here, because they cannot be uninstalled separately.
#
#   [project.entry-points."sima_vision.tasks"]
#   count = "my_package.count:CountTask"

[tool.hatch.version]
path = "sima_vision/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["sima_vision"]

[tool.hatch.build.targets.sdist]
include = [
    "/sima_vision",
    "/tests",
    "/README.md",
    "/LICENSE",
]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B"]
ignore = [
    "E741",   # ambiguous variable name: `l` is not used, but `I` reads fine here
    "B008",   # function call in default argument: frozen dataclasses are fine
]

[tool.pytest.ini_options]
testpaths = ["tests"]
